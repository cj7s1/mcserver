[project]
name = "mcpanel-agent"
version = "0.1.0"
description = "Privileged node agent for MCPanel: narrow, authenticated Docker + instance-storage operations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "docker>=7.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a reachable Docker daemon",
    "minecraft: starts a real Minecraft server container (slow, downloads server jars)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607", "S108", "RUF012", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
