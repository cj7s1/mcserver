name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mcpanel
          POSTGRES_USER: mcpanel
          POSTGRES_PASSWORD: mcpanel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpanel -d mcpanel"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MCPANEL_TESTING: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mcpanel
      POSTGRES_USER: mcpanel
      POSTGRES_PASSWORD: mcpanel
      MCPANEL_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests (without integration)
        run: uv run pytest -q -m "not integration"

  agent:
    name: Agent (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        # `minecraft`-marked tests start real servers and download jars; run them manually.
        run: uv run pytest -q -m "not minecraft"

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check + build
        run: npm run build
      - name: Unit tests (vitest)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "package.json has no \"test\" script; skipping unit tests."
          fi

  docker:
    name: Docker images + Compose (acceptance tests of the panel container)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck deployment scripts
        # install-hook.sh on a line of its own: SC2016 is its sed expression, which is in single
        # quotes on purpose (it reads a line of the hook as text, "${...}" included).
        run: |
          shellcheck --version
          shellcheck deploy/scripts/generate-secrets.sh deploy/scripts/upgrade.sh backend/container/entrypoint.sh \
            .github/scripts/panel-acceptance.sh .github/scripts/upgrade-rehearsal.sh deploy/unraid/stopping_docker
          shellcheck --exclude=SC2016 deploy/unraid/install-hook.sh
      - name: Generate throw-away env files
        run: |
          deploy/scripts/generate-secrets.sh "$RUNNER_TEMP/ci.env"
          deploy/scripts/generate-secrets.sh --node "$RUNNER_TEMP/node.env"
      - name: Validate Compose files
        run: |
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/ci.env" config -q
          docker compose -f deploy/docker-compose.dev.yml config -q
          docker compose -f deploy/docker-compose.node.yml --env-file "$RUNNER_TEMP/node.env" config -q
      - uses: docker/setup-buildx-action@v4
      - name: Build panel image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: mcpanel/panel:local
          cache-from: type=gha,scope=panel
          cache-to: type=gha,mode=max,scope=panel
      - name: Build agent image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          push: false
          load: true
          tags: mcpanel/agent:local
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Smoke test the Compose stack
        run: |
          mkdir -p "$RUNNER_TEMP/mcpanel-data"
          sed -i -e "s|^MCPANEL_DATA_DIR=.*|MCPANEL_DATA_DIR=$RUNNER_TEMP/mcpanel-data|" \
                 -e "s|^MCPANEL_WORKER_CONCURRENCY=.*|MCPANEL_WORKER_CONCURRENCY=4|" "$RUNNER_TEMP/ci.env"
          cp "$RUNNER_TEMP/ci.env" deploy/.env   # git-ignored; the steps below use plain `docker compose` in deploy/
          cd deploy
          if ! docker compose up -d --no-build --wait --wait-timeout 300; then
            docker compose ps -a
            docker compose logs --no-color --tail 200
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          docker compose ps
          # three containers: the web server, both workers, the scheduler and Redis are processes of `panel`
          test "$(docker compose ps --services --status running | sort | tr '\n' ' ')" = "agent panel postgres "
      - name: Acceptance tests of the panel container (supervisor, Redis socket, health, stop, guard)
        working-directory: deploy
        run: ../.github/scripts/panel-acceptance.sh
      - name: Redis as its own container (profile external-redis) still works
        working-directory: deploy
        run: |
          printf 'COMPOSE_PROFILES=external-redis\nMCPANEL_REDIS_URL=redis://redis:6379/0\n' >> .env
          docker compose up -d --no-build --wait --wait-timeout 300
          test "$(docker compose ps --services --status running | sort | tr '\n' ' ')" = "agent panel postgres redis "
          processes=$(docker compose exec -T panel python /usr/local/bin/mcpanel-supervise.py status)
          echo "$processes"
          if grep -q '^  redis ' <<<"$processes"; then echo "the panel still runs its own Redis"; exit 1; fi
          if docker compose exec -T panel test -S /run/mcpanel/redis.sock; then echo "a Redis socket exists"; exit 1; fi
          docker compose exec -T panel python /usr/local/bin/mcpanel-healthcheck.py all
      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose --profile external-redis down -v --remove-orphans || true

  upgrade:
    name: Upgrade + rollback rehearsal (7 containers -> 3 -> 7 -> 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The last revision of the one-role-per-container layout (panel, worker, worker-periodic, beat,
      # agent, postgres, redis). The rehearsal builds it, fills it with data and upgrades it in place.
      OLD_LAYOUT_REV: 22a2c790ee6d73a47e55da1bc1abec5270a5dcb4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: A deployment of the old revision (a clone, like the checkout on a server)
        run: |
          umask 022   # upgrade.sh refuses a checkout that group or others can write (security review D-2)
          git clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site"
          git -C "$RUNNER_TEMP/site" checkout --quiet -B rehearsal "$OLD_LAYOUT_REV"
          git -C "$RUNNER_TEMP/site" config user.email ci@example.invalid
          git -C "$RUNNER_TEMP/site" config user.name ci
          cd "$RUNNER_TEMP/site/deploy"
          ./scripts/generate-secrets.sh
          mkdir -p "$RUNNER_TEMP/site-data"
          sed -i "s|^MCPANEL_DATA_DIR=.*|MCPANEL_DATA_DIR=$RUNNER_TEMP/site-data|" .env
      - name: Old layout -> upgrade.sh run -> rollback -> run again, with data
        run: .github/scripts/upgrade-rehearsal.sh "$RUNNER_TEMP/site" "$GITHUB_SHA" http://127.0.0.1:8080
      - name: Tear down
        if: always()
        run: cd "$RUNNER_TEMP/site/deploy" && docker compose --profile external-redis down -v --remove-orphans || true

  security:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: pip-audit (backend)
        continue-on-error: true
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/backend-requirements.txt"
          uvx pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/backend-requirements.txt"
      - name: pip-audit (agent)
        continue-on-error: true
        working-directory: agent
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/agent-requirements.txt"
          uvx pip-audit --disable-pip --require-hashes -r "$RUNNER_TEMP/agent-requirements.txt"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (frontend)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
