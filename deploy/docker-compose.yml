# MCPanel production stack (single node).
#
#   cd deploy
#   ./scripts/generate-secrets.sh          # creates .env with random secrets (once)
#   $EDITOR .env                           # data dir, bind address, hosts, UID/GID
#   docker compose up -d --build
#
# Upgrades: ./scripts/upgrade.sh status | dry-run | run | rollback (DEPLOYMENT.md, "Upgrading").
#
# Services (three containers):
#   postgres  the database
#   agent     the ONLY service with the Docker socket; creates the Minecraft containers
#   panel     everything else, as processes of one container under a small supervisor
#             (backend/container/supervise.py): redis (Unix socket only, no persistence),
#             web (UI + API + WebSockets), worker (Celery: jobs, and periodic tasks when a
#             slot is free), periodic (Celery, 2 slots, only the short periodic tasks:
#             reconcile, schedules, watchdog, metrics, so they keep running while long jobs
#             fill every worker slot) and beat (Celery scheduler).
#             `docker compose exec panel python /usr/local/bin/mcpanel-supervise.py status`
#             shows them; every log line of `docker compose logs panel` starts with the
#             name of the process that wrote it.
# Optional fourth container: redis, only with the profile `external-redis` (see the
# service below). It is the way back if Redis inside the panel container ever misbehaves.
#
# Networks:
#   internal           panel, agent, postgres (and redis with the profile). Not marked
#                      `internal: true` because the panel needs outbound HTTPS to
#                      Mojang/Modrinth/CurseForge/FTB.
#   mcpanel_instances  shared by the agent and every Minecraft container it creates,
#                      so the agent reaches RCON (25575) via the container IP without
#                      publishing it. Postgres/Redis/panel are NOT on this network.
#                      Minecraft containers (third-party mod code) can reach the agent
#                      port on it; every agent request except /v1/health requires
#                      the bearer token, so keep MCPANEL_AGENT_TOKEN long and secret.
#
# Minecraft server containers are created by the agent through the Docker API, not by
# Compose: `docker compose down` leaves running servers alone (and Compose will report
# that mcpanel_instances is still in use). Stop servers from the panel first if you
# want everything down. If no server is running, `down` removes mcpanel_instances and
# `up` creates it again; the agent reconnects stopped servers to the new network when
# they are next started.
#
# If an agent run outside Compose already created the `mcpanel_instances` network,
# Compose warns that it "was not created by compose" and reuses it; that is harmless.

name: mcpanel

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The panel container carries the log of five processes, so it gets twice the space
# (5 x 20 MB). The periodic worker and the scheduler log at WARNING and no process logs a
# line per tick, which leaves requests, jobs and warnings: months of history at home use.
x-panel-logging: &panel-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Environment of the panel container (see backend/mcpanel/settings.py).
x-panel-env: &panel-env
  TZ: ${TZ:-UTC}
  MCPANEL_SECRET_KEY: ${MCPANEL_SECRET_KEY:?MCPANEL_SECRET_KEY is not set - run deploy/scripts/generate-secrets.sh}
  MCPANEL_SECRET_KEY_FALLBACKS: ${MCPANEL_SECRET_KEY_FALLBACKS:-}
  # First-run setup token, written by generate-secrets.sh (empty = the setup page is open to
  # whoever reaches the panel first).
  MCPANEL_SETUP_TOKEN: ${MCPANEL_SETUP_TOKEN:-}
  MCPANEL_AGENT_URL: http://agent:8700
  MCPANEL_AGENT_TOKEN: ${MCPANEL_AGENT_TOKEN:?MCPANEL_AGENT_TOKEN is not set - run deploy/scripts/generate-secrets.sh}
  MCPANEL_AGENT_TIMEOUT: ${MCPANEL_AGENT_TIMEOUT:-}
  MCPANEL_AGENT_TLS_FINGERPRINT: ${MCPANEL_AGENT_TLS_FINGERPRINT:-}
  MCPANEL_AGENT_CA_BUNDLE: ${MCPANEL_AGENT_CA_BUNDLE:-}
  # Redis runs inside the panel container and is reached through a Unix socket: it has no
  # network listener. Both variables are empty in a normal .env. With the `external-redis`
  # profile set MCPANEL_REDIS_URL=redis://redis:6379/0. The broker URL follows MCPANEL_REDIS_URL
  # whenever it is empty: the panel derives it (backend/mcpanel/settings.py, celery_broker_url),
  # because Celery writes a Unix socket differently (redis+socket://...) than everything else.
  MCPANEL_REDIS_URL: ${MCPANEL_REDIS_URL:-unix:///run/mcpanel/redis.sock?db=0}
  MCPANEL_CELERY_BROKER_URL: ${MCPANEL_CELERY_BROKER_URL:-}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-mcpanel}
  POSTGRES_USER: ${POSTGRES_USER:-mcpanel}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run deploy/scripts/generate-secrets.sh}
  MCPANEL_ALLOWED_HOSTS: ${MCPANEL_ALLOWED_HOSTS:-localhost,127.0.0.1}
  MCPANEL_CSRF_TRUSTED_ORIGINS: ${MCPANEL_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  MCPANEL_BEHIND_TLS_PROXY: ${MCPANEL_BEHIND_TLS_PROXY:-false}
  # Empty = loopback only; set it to the reverse proxy's address (backend/container/entrypoint.sh).
  MCPANEL_FORWARDED_ALLOW_IPS: ${MCPANEL_FORWARDED_ALLOW_IPS:-}
  MCPANEL_SECURE_COOKIES: ${MCPANEL_SECURE_COOKIES:-false}
  MCPANEL_SESSION_AGE_SECONDS: ${MCPANEL_SESSION_AGE_SECONDS:-}
  MCPANEL_PUBLIC_HOSTNAME: ${MCPANEL_PUBLIC_HOSTNAME:-}
  MCPANEL_LAN_ADDRESS: ${MCPANEL_LAN_ADDRESS:-}
  MCPANEL_PORT_RANGE_START: ${MCPANEL_PORT_RANGE_START:-25565}
  MCPANEL_PORT_RANGE_END: ${MCPANEL_PORT_RANGE_END:-25665}
  MCPANEL_MAX_UPLOAD_BYTES: ${MCPANEL_MAX_UPLOAD_BYTES:-}
  CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
  MCPANEL_WEBHOOK_ALLOW_LAN: ${MCPANEL_WEBHOOK_ALLOW_LAN:-true}
  MCPANEL_LOG_LEVEL: ${MCPANEL_LOG_LEVEL:-INFO}
  MCPANEL_LOG_JSON: ${MCPANEL_LOG_JSON:-true}
  MCPANEL_WORKER_CONCURRENCY: ${MCPANEL_WORKER_CONCURRENCY:-}
  # Remove the container of a server that is stopped (empty or true = on; false keeps exited containers).
  MCPANEL_RETIRE_STOPPED_CONTAINERS: ${MCPANEL_RETIRE_STOPPED_CONTAINERS:-}
  # Job reliability tuning; empty = the defaults in backend/mcpanel/settings.py.
  MCPANEL_CELERY_VISIBILITY_TIMEOUT: ${MCPANEL_CELERY_VISIBILITY_TIMEOUT:-}
  MCPANEL_JOB_HEARTBEAT_SECONDS: ${MCPANEL_JOB_HEARTBEAT_SECONDS:-}
  MCPANEL_JOB_STALE_SECONDS: ${MCPANEL_JOB_STALE_SECONDS:-}
  MCPANEL_JOB_MAX_RUNTIME_HOURS: ${MCPANEL_JOB_MAX_RUNTIME_HOURS:-}

# The panel processes run as UID 10001 and need no Linux capabilities. `init: true` puts
# tini in front of the supervisor (signal forwarding, reaping).
x-panel-hardening: &panel-hardening
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    # Mutable tag on purpose, so `./scripts/upgrade.sh run` (which pulls it) brings security
    # fixes (DEPLOYMENT.md, "Upgrading"). To pin an exact build use
    # postgres:16-alpine@sha256:<digest> instead.
    image: postgres:16-alpine
    # always, not unless-stopped (panel, agent and postgres alike): Docker starts these again at its
    # next start even after they were stopped through its API (an Unraid folder's Stop, the
    # Appdata Backup plugin's stop-all), so the panel does not stay down across a reboot.
    restart: always
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-mcpanel}
      POSTGRES_USER: ${POSTGRES_USER:-mcpanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run deploy/scripts/generate-secrets.sh}
    volumes:
      # Named volume by default; set MCPANEL_POSTGRES_DIR to an absolute host path
      # (e.g. /mnt/user/appdata/mcpanel-db on Unraid) to use a bind mount instead.
      - ${MCPANEL_POSTGRES_DIR:-postgres_data}:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      # TCP check: during first-time initdb the server only listens on the Unix socket,
      # so this stays unhealthy until the real server is up.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging

  # NOT started by default. Redis normally runs inside the panel container. To run it as its
  # own container instead (as before the single panel container), put these two lines into
  # .env and run `./scripts/upgrade.sh run --no-build`:
  #   COMPOSE_PROFILES=external-redis
  #   MCPANEL_REDIS_URL=redis://redis:6379/0
  # Remove them again (and run the same command) to go back to the default.
  redis:
    profiles: ["external-redis"]
    image: redis:7-alpine
    restart: unless-stopped
    # Cache, Channels layer and Celery broker. RDB snapshots keep queued tasks across
    # restarts; job state itself lives in Postgres.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *logging

  agent:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: mcpanel/agent:${MCPANEL_IMAGE_TAG:-local}
    # Built here, never pulled: `docker compose pull` must not fetch an image of this name
    # from a registry (it would get the Docker socket).
    pull_policy: never
    restart: always
    init: true
    # Root inside the container is required (Docker socket, chown of instance data);
    # see agent/Dockerfile. no-new-privileges still applies to everything it execs.
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
      AGENT_TOKEN: ${MCPANEL_AGENT_TOKEN:?MCPANEL_AGENT_TOKEN is not set - run deploy/scripts/generate-secrets.sh}
      # Same absolute path inside and outside the container: the agent hands instance
      # directories to the Docker daemon as bind-mount sources.
      AGENT_DATA_ROOT: ${MCPANEL_DATA_DIR:?MCPANEL_DATA_DIR is not set in .env}
      AGENT_BACKUP_ROOT: ${MCPANEL_BACKUP_DIR:-${MCPANEL_DATA_DIR}/backups}
      AGENT_INSTANCE_NETWORK: mcpanel_instances
      AGENT_RUNTIME_UID: ${MC_UID:-1000}
      AGENT_RUNTIME_GID: ${MC_GID:-1000}
      AGENT_RESTIC_PASSWORD: ${AGENT_RESTIC_PASSWORD:?AGENT_RESTIC_PASSWORD is not set - run deploy/scripts/generate-secrets.sh}
      AGENT_PORT_MIN: ${AGENT_PORT_MIN:-1024}
      AGENT_PORT_MAX: ${AGENT_PORT_MAX:-65535}
      AGENT_MAX_MEMORY_MB: ${AGENT_MAX_MEMORY_MB:-65536}
      # Longest time Docker itself may wait for a server when the host or the Docker daemon stops.
      AGENT_SHUTDOWN_STOP_TIMEOUT: ${AGENT_SHUTDOWN_STOP_TIMEOUT:-20}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MCPANEL_DATA_DIR}:${MCPANEL_DATA_DIR}
      - ${MCPANEL_BACKUP_DIR:-${MCPANEL_DATA_DIR}/backups}:${MCPANEL_BACKUP_DIR:-${MCPANEL_DATA_DIR}/backups}
    networks: [internal, instances]
    # No `ports:` on purpose - the agent API must never be published on the host.
    stop_grace_period: 30s
    logging: *logging

  panel:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # set by deploy/scripts/upgrade.sh; the image label io.mcpanel.revision records it
        MCPANEL_REVISION: ${MCPANEL_REVISION:-unknown}
    image: mcpanel/panel:${MCPANEL_IMAGE_TAG:-local}
    # Built here, never pulled (it receives every secret of the stack).
    pull_policy: never
    # One container for the web server, both Celery workers, the scheduler and Redis
    # (backend/container/entrypoint.sh, supervise.py). Migrations run before they start.
    command: ["all"]
    restart: always
    <<: *panel-hardening
    environment: *panel-env
    ports:
      - "${MCPANEL_BIND:-127.0.0.1}:${MCPANEL_PORT:-8080}:8000"
    networks: [internal]
    # The supervisor's status file and the Redis socket: memory only, this user only.
    tmpfs:
      - /run/mcpanel:uid=10001,gid=10001,mode=0700,size=16m
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_started
    # Healthy = /api/health (database + cache) answers, every process of the container
    # runs, both workers answered a ping in the last 2 minutes and the reconcile tick ran
    # in the last 3 minutes. `docker inspect -f '{{json .State.Health.Log}}' <container>`
    # names the part that is down.
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/mcpanel-healthcheck.py", "all"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    # On a stop the job worker gets up to 110 s to finish the running jobs (Celery warm
    # shutdown); the supervisor stops everything else in order and is done after 116 s at
    # the latest. Jobs cut off by a hard kill are marked failed by the job runner instead of
    # being re-run blindly. Unraid's own Stop/Restart buttons give 10 s only: use them when
    # no job is running, or `docker compose restart panel`.
    stop_grace_period: 2m
    logging: *panel-logging

networks:
  internal: {}
  instances:
    name: mcpanel_instances

volumes:
  postgres_data: {}
  redis_data: {}
